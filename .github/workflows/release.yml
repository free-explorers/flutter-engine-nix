name: Source Engine Release

# Builds and publishes the source engine to the project Cachix cache. Given a
# Flutter version it resolves the engine pin itself (scripts/resolve-version.py:
# tag commit, bin/internal/engine.version, the DEPS revisions, and the fetched
# hashes), commits it, and builds -- the engine repository is a client of the
# Flutter bump, not a gate in front of it.

on:
  workflow_dispatch:
    inputs:
      flutter_version:
        description: Flutter release to resolve and build; empty uses the repository default
        required: false
        default: ""
        type: string

permissions:
  contents: read

concurrency:
  group: source-engine-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'free-explorers/flutter-engine-nix' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    permissions:
      contents: write
    env:
      # Empty means "build the repository default in default.json"; otherwise
      # every build below honours the version this run was asked for.
      FLUTTER_VERSION: ${{ inputs.flutter_version }}
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Reclaim unused runner tools and require 30 GiB
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h / /mnt
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          available=$(df --output=avail -B1 / | tr -dc '0-9')
          (( available >= 30 * 1024 * 1024 * 1024 ))

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            max-jobs = 1
            cores = 4
            experimental-features = nix-command flakes

      - name: Resolve and commit the engine pin
        env:
          FLUTTER_VERSION: ${{ inputs.flutter_version }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ -z "$FLUTTER_VERSION" ]]; then
            echo "no version supplied; building the repository default" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          nix shell nixpkgs#nix-prefetch-git -c python3 scripts/resolve-version.py "$FLUTTER_VERSION"
          if git diff --quiet engine-source.json bootstrap-dart.json; then
            echo "pin for $FLUTTER_VERSION already committed" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "Veshell release bot"
          git config user.email "releases@veshell.invalid"
          git add engine-source.json bootstrap-dart.json
          git commit -m "engine: resolve pin for Flutter $FLUTTER_VERSION"
          git push origin HEAD:main

      - name: Use the project cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: veshell
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and diagnose the source engine (240 minute bound)
        env:
          ENGINE_BUILD_TIMEOUT: 240m
        shell: bash
        run: bash build-engine.sh

      - name: Build the independent runtime and run the synthetic AOT check
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          nix_args=()
          if [[ -n "$FLUTTER_VERSION" ]]; then
            nix_args+=(--argstr flutterVersion "$FLUTTER_VERSION")
          fi
          nix-build default.nix "${nix_args[@]}" -A runtime --no-out-link --max-jobs 1 --cores 4
          timeout --signal=INT --kill-after=60s 15m \
            nix-build default.nix "${nix_args[@]}" -A aot --no-out-link --max-jobs 1 --cores 4
          echo 'Synthetic AOT compile/load passed; no full application integration or rendering test claimed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the engine, runtime and AOT check to the cache
        shell: bash
        run: |
          set -euo pipefail
          nix_args=()
          if [[ -n "$FLUTTER_VERSION" ]]; then
            nix_args+=(--argstr flutterVersion "$FLUTTER_VERSION")
          fi
          mapfile -t roots < <(
            nix-build default.nix "${nix_args[@]}" -A engine -A runtime -A aot \
              --no-out-link --max-jobs 1 --cores 4
          )
          printf '%s\n' "${roots[@]}"
          cachix push veshell "${roots[@]}"

      - name: Final resource sample
        if: always()
        shell: bash
        run: |
          free -h
          df -h / /mnt

      - name: Notify Veshell that the build finished
        if: always()
        # A missing or unsuccessful dispatch must not fail a build that worked.
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.VESHELL_DISPATCH_TOKEN }}
        run: |
          gh api repos/free-explorers/veshell/dispatches -f event_type=flutter-bump >/dev/null
          echo "dispatched flutter-bump to free-explorers/veshell"
