name: Source Engine Release

# Builds the source engine and publishes its closure to the project Cachix
# cache. Substituting from the cache is what lets Veshell (and its release
# workflow) avoid compiling the engine. No release assets are produced; the
# cache is the distribution channel.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: source-engine-release
  cancel-in-progress: false

jobs:
  release:
    if: github.repository == 'free-explorers/flutter-engine-nix' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 330
    steps:
      - name: Checkout trusted source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Reclaim unused runner tools and require 30 GiB
        shell: bash
        run: |
          set -euo pipefail
          nproc
          free -h
          df -h / /mnt
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc \
            /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          available=$(df --output=avail -B1 / | tr -dc '0-9')
          (( available >= 30 * 1024 * 1024 * 1024 ))

      - name: Install Nix
        uses: cachix/install-nix-action@13d8dd58da0234aa297dedd986986ccb8e7f3e24 # v31
        with:
          extra_nix_config: |
            max-jobs = 1
            cores = 4
            experimental-features = nix-command flakes

      - name: Use the project cache
        uses: cachix/cachix-action@38b082610b782e7e93e209c35fd730d399dee866 # v17
        with:
          name: veshell
          authToken: ${{ secrets.CACHIX_AUTH_TOKEN }}

      - name: Build and diagnose the source engine (240 minute bound)
        env:
          ENGINE_BUILD_TIMEOUT: 240m
        shell: bash
        run: bash build-engine.sh

      - name: Build the independent runtime and run the synthetic AOT check
        timeout-minutes: 20
        shell: bash
        run: |
          set -euo pipefail
          nix-build default.nix -A runtime --no-out-link --max-jobs 1 --cores 4
          timeout --signal=INT --kill-after=60s 15m \
            nix-build default.nix -A aot --no-out-link --max-jobs 1 --cores 4
          echo 'Synthetic AOT compile/load passed; no full application integration or rendering test claimed.' >> "$GITHUB_STEP_SUMMARY"

      - name: Publish the engine, runtime and AOT check to the cache
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t roots < <(
            nix-build default.nix -A engine -A runtime -A aot \
              --no-out-link --max-jobs 1 --cores 4
          )
          printf '%s\n' "${roots[@]}"
          cachix push veshell "${roots[@]}"

      - name: Final resource sample
        if: always()
        shell: bash
        run: |
          free -h
          df -h / /mnt
